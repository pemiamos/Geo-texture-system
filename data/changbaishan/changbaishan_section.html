const UNIT_COLORS = {
  'βN2-Qp-1':'#7a8b5e','τQp-2':'#e2725b','τQh':'#f4c95d','τQ4':'#e8927c',
  'τQ2':'#d95f43','βQ1':'#97a566','βN':'#5f7148','Q4-3':'#fdf3c0',
};
function colorOf(code, name){
  if (UNIT_COLORS[code]) return UNIT_COLORS[code];
  const c = code || '';
  if (/^β/.test(c)) return '#85956b';
  if (/^τ/.test(c)) return '#e09060';
  if (/^γ/.test(c)) return '#e87a7a';
  if (/^Qh|^Q4/.test(c)) return '#fdf6cf';
  if (/^Q/.test(c))  return '#f7ec9e';
  if (/^N/.test(c))  return '#ffd94a';
  if (/^E/.test(c))  return '#fdb462';
  if (/^K/.test(c))  return '#9ed27c';
  if (/^J/.test(c))  return '#6fc8dc';
  if (/^T/.test(c))  return '#b78cc1';
  if (/^P/.test(c))  return '#f08a76';
  if (/^C/.test(c))  return '#86b0a2';
  if (/^D/.test(c))  return '#d2a35f';
  if (/^S/.test(c))  return '#bfe3c0';
  if (/^O/.test(c))  return '#54b08a';
  if (/^ε|^Є/.test(c)) return '#7fbfa0';
  if (/^Z|^Pt|^Ar/.test(c)) return '#f0a4b4';
  let h=0; for (const ch of (code+name)) h=(h*31+ch.charCodeAt(0))>>>0;
  return `hsl(${h%360},45%,72%)`;
}

const svg = document.getElementById('section');
const W=1160, H=370, mL=58, mR=18, mT=16, mB=44;
const pw=W-mL-mR, ph=H-mT-mB;
const E0=500, E1=2750;
const X = t => mL + t*pw;
const Y = e => mT + (1-(e-E0)/(E1-E0))*ph;
const NS='http://www.w3.org/2000/svg';
function el(n,a,parent){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(parent||svg).appendChild(e);return e;}
function elevAt(t){
  const {ts,elev}=SEC;
  if(t<=ts[0])return elev[0];
  for(let i=1;i<ts.length;i++) if(t<=ts[i]){
    const f=(t-ts[i-1])/(ts[i]-ts[i-1]); return elev[i-1]+f*(elev[i]-elev[i-1]);
  }
  return elev[elev.length-1];
}

const STEP=0.0015;
for(const [t0,t1,name,code] of SEC.segs){

  for(let t=t0;t<=t1+1e-9;t+=STEP){const tt=Math.min(t,t1); d+='L'+X(tt)+','+Y(elevAt(tt));}

}

  cel('rect',{x:CX,y,width:CW,height:rh,fill:colorOf(u.code,u.name),stroke:'#444','stroke-width':1});
  cel('rect',{x:CX,y,width:CW,height:rh,fill:`url(#p-${u.lith})`,stroke:'none'});
  // 不整合/喷发间断: 波浪线 (火山岩之间统一用波浪接触示意)
  if(i>0){
    let d='M'+CX+','+y; for(let x=0;x<CW;x+=10) d+=`q5,-3 10,0`;
    cel('path',{d,fill:'none',stroke:'#333','stroke-width':1});
  }
  cel('text',{x:CX-8,y:y+rh/2-4,'text-anchor':'end','font-size':10,fill:'#666'}).textContent=u.epoch;
  cel('text',{x:CX+CW/2,y:y+rh/2+4,'text-anchor':'middle','font-size':12,'font-weight':'bold',fill:'#1a1a1a'}).textContent=u.code;
  cel('text',{x:CX+CW+10,y:y+rh/2-2,'font-size':12}).textContent=u.name;
  cel('text',{x:CX+CW+10,y:y+rh/2+13,'font-size':10,fill:'#777'}).textContent=u.age?('年龄: '+u.age):'年龄: —';
});
// ---------- 图例 ----------
const lgDiv=document.getElementById('legend');
const seen=new Map();
for(const [,,name,code] of SEC.segs) if(!seen.has(code)) seen.set(code,name);
lgDiv.innerHTML='<b style="width:100%">剖面单元:</b>'+[...seen].map(([c,n]) =>
  `<span class="lg"><span class="sw" style="background:${colorOf(c,n)}"></span>${n} (${c})</span>`).join('');
</script>
